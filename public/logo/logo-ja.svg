<?xml version="1.0" encoding="UTF-8"?>
<!-- Memorips ロゴ（日本語）— Spark Atlas concept
     アイコン + 「メモリップ」テキスト
     viewBox: 200x48 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" fill="none" role="img" aria-label="メモリップ">
  <defs>
    <linearGradient id="pinGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- ─── アイコンマーク（48x48 と同一デザイン） ─── -->
  <path
    d="M24 44 C14 36,9 28,9 19 A15 15 0 0 1 39 19 C39 28,34 36,24 44 Z"
    fill="url(#pinGradLogo)"
  />
  <circle cx="24" cy="19" r="7.5" fill="white" opacity="0.96"/>
  <path
    d="M24 14.5 L25.5 17.5 L28.5 19 L25.5 20.5 L24 23.5 L22.5 20.5 L19.5 19 L22.5 17.5 Z"
    fill="url(#pinGradLogo)"
  />
  <circle cx="7"  cy="9"  r="2"   fill="#38bdf8" opacity="0.70"/>
  <circle cx="37" cy="5"  r="1.5" fill="#34d399" opacity="0.70"/>

  <!-- ─── 「メモリップ」テキスト ─── -->
  <text
    x="54"
    y="33"
    font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif"
    font-size="24"
    font-weight="700"
    fill="#0f172a"
    letter-spacing="-0.5"
  >メモリップ</text>
</svg>
