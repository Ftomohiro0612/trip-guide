<?xml version="1.0" encoding="UTF-8"?>
<!-- Memorips シンボルマーク — Spark Atlas concept
     地図ピン + きらめき + おでかけの軌跡
     viewBox: 48x48, 背景なし -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" role="img" aria-label="メモリップ">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- 地図ピン本体（sky-400 → emerald-400 グラデーション） -->
  <!-- pin-head center: (24,19) r=15 / tip: (24,44) -->
  <path
    d="M24 44 C14 36,9 28,9 19 A15 15 0 0 1 39 19 C39 28,34 36,24 44 Z"
    fill="url(#pinGrad)"
  />

  <!-- ピン内の白い円（余白） -->
  <circle cx="24" cy="19" r="7.5" fill="white" opacity="0.96"/>

  <!-- きらめき星（4点スター, ピン内に収まるサイズ） -->
  <path
    d="M24 14.5 L25.5 17.5 L28.5 19 L25.5 20.5 L24 23.5 L22.5 20.5 L19.5 19 L22.5 17.5 Z"
    fill="url(#pinGrad)"
  />

  <!-- 周囲のきらめき点（発見・子どもの好奇心） -->
  <circle cx="7"  cy="9"  r="2"   fill="#38bdf8" opacity="0.70"/>
  <circle cx="37" cy="5"  r="1.5" fill="#34d399" opacity="0.70"/>
  <circle cx="42" cy="26" r="1.5" fill="#06b6d4" opacity="0.55"/>
</svg>
